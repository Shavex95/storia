<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light}[hidden]{display:none!important}</style>
<title>Simulatore Test 29 SGT</title>
<style>
:root{
  /* Concept: plancia di comando. Carta nautica chiara, inchiostro blu notte, ottone per ciò che richiede un'azione. */
  --paper:#EDF1F3; --surface:#FFFFFF; --ink:#0B2036; --ink-soft:#4A6076; --line:#CBD5DC;
  --band-bg:#0F2B46; --band-fg:#EAF1F6; --band-dim:#A3B8CA; --band-accent:#E2B04D; --band-line:rgba(234,241,246,.38);
  --brass:#8A5E0E; --brass-fill:#D9A441; --on-brass:#0B2036;
  --ok:#16714A; --ok-bg:#DDF1E6; --bad:#B3261E; --bad-bg:#FADFDC;
  --sel-bg:#0F2B46; --sel-fg:#EAF1F6; --focus:#1D5FA8;
  --f-display:'Avenir Next Condensed','HelveticaNeue-CondensedBold','Arial Narrow','Roboto Condensed','sans-serif-condensed',system-ui,sans-serif;
  --f-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#07131F; --surface:#0D2133; --ink:#E6EEF4; --ink-soft:#9DB2C4; --line:#223B52;
    --band-bg:#0A2036; --brass:#E2B04D;
    --ok:#5ED19B; --ok-bg:#12382A; --bad:#FF8A80; --bad-bg:#431B19;
    --sel-bg:#E6EEF4; --sel-fg:#0B2036; --focus:#7DB7F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#07131F; --surface:#0D2133; --ink:#E6EEF4; --ink-soft:#9DB2C4; --line:#223B52;
  --band-bg:#0A2036; --brass:#E2B04D;
  --ok:#5ED19B; --ok-bg:#12382A; --bad:#FF8A80; --bad-bg:#431B19;
  --sel-bg:#E6EEF4; --sel-fg:#0B2036; --focus:#7DB7F2; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{width:100%;max-width:40rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Fascia di bordo */
.band{background:var(--band-bg);color:var(--band-fg)}
.band-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.75rem}
.brand{display:flex;align-items:center;gap:.5rem;font:600 1.0625rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;min-width:0}
.brand svg{flex:none;color:var(--band-accent)}
.band-tag{font:500 .75rem/1 var(--f-mono);color:var(--band-dim);letter-spacing:.04em;white-space:nowrap}
.band-btn{background:transparent;border:1px solid var(--band-line);color:var(--band-fg);border-radius:4px;min-height:2.5rem;padding:.35rem .8rem;font:600 .9375rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.band-btn.arm{border-color:var(--band-accent);color:var(--band-accent)}

/* Home */
.hero{background:var(--band-bg);color:var(--band-fg)}
.hero-in{padding-block:1.25rem 1.75rem}
.eyebrow{margin:0 0 .5rem;font:600 .875rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--band-accent)}
h1{margin:0;font:700 clamp(2.9rem,14vw,4.6rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.lead{margin:1rem 0 0;color:var(--band-dim);max-width:34ch}
.subjects{display:grid;gap:.5rem;margin:.25rem 0 1.5rem}
.subj{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;min-height:3.5rem;padding:.6rem .9rem;text-align:left;background:transparent;border:1.5px solid var(--band-line);border-radius:6px;color:var(--band-fg);font:600 1.1875rem/1.15 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.subj-name{min-width:0;overflow-wrap:anywhere}
.subj-n{flex:none;font:500 .8125rem/1 var(--f-mono);letter-spacing:0;color:var(--band-dim)}
.subj[aria-pressed="true"]{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass)}
.subj[aria-pressed="true"] .subj-n{color:var(--on-brass)}
.fb-note{flex-basis:100%;font-size:.9375rem}
.acc{display:grid;gap:.5rem}
.acc-h{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;min-height:3.25rem;padding:.6rem .85rem;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;text-align:left}
.acc-h b{display:block;font:600 1.0625rem/1.15 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.acc-h small{display:block;margin-top:.2rem;font:400 .75rem/1.35 var(--f-mono);color:var(--ink-soft);overflow-wrap:anywhere}
.acc-h > span{min-width:0}
.chev{flex:none;width:.55rem;height:.55rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:.2rem}
.acc-h[aria-expanded="true"] .chev{transform:rotate(-135deg)}
.acc-b{display:grid;gap:1rem;padding:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.field{display:grid;gap:.45rem}
.field .label{margin:0}
.size-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem}
.src{display:grid;gap:.4rem}
.mini{min-height:2.75rem;padding:.4rem .5rem;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:600 1rem/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.mini[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.mini[disabled]{opacity:.4;cursor:not-allowed}
.src .mini{display:flex;justify-content:space-between;align-items:center;gap:.75rem;text-align:left;padding:.5rem .75rem}
.src .mini small{font:400 .8125rem/1 var(--f-mono);letter-spacing:0}
.mini.wide{width:100%;text-align:left;padding:.55rem .75rem;letter-spacing:.04em}
.num-l{font-size:.875rem;color:var(--ink-soft)}
.num{width:100%;min-height:2.75rem;padding:.4rem .75rem;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:500 1rem/1 var(--f-mono)}
.num:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wls{display:grid;gap:.6rem;margin-top:.25rem}
.wl{display:grid;gap:.5rem}
.wl-list{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.wl-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem .75rem;align-items:start;padding:.7rem .8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.wl-q{margin:0;font-weight:700;font-size:.9375rem;line-height:1.35;overflow-wrap:anywhere}
.wl-a{margin:.25rem 0 0;font-size:.875rem;line-height:1.35;color:var(--ok);overflow-wrap:anywhere}
.wl-x{min-height:2.5rem;padding:.3rem .65rem;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink-soft);font:600 .8125rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.legal{margin:1.5rem 0 0;padding-top:1rem;border-top:1px solid var(--line);color:var(--ink-soft);font-size:.8125rem;line-height:1.5;max-width:60ch}
.wl-empty{margin:0;color:var(--ink-soft);font-size:.9375rem}
.half{min-height:2.75rem;font-size:1.0625rem;gap:.6rem}
.half small{font:400 .75rem/1 var(--f-mono);letter-spacing:0;text-transform:none;opacity:.85}
.cyc{overflow:hidden}
.cyc-in{display:flex;align-items:flex-end;gap:.75rem}
.bike{flex:none;color:var(--band-fg);line-height:0}
.bike-svg{display:block;width:6.75rem;height:auto}
.tail{transform-box:fill-box;transform-origin:right bottom;animation:wag 1.5s ease-in-out infinite}
.play .ferret{animation:bob .32s ease-in-out 10 both}
@keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes bob{50%{transform:translateY(-1.3px)}}
.wheel{transform-box:fill-box;transform-origin:center}
.say{position:relative;align-self:center;margin-bottom:1.1rem;padding:.55rem .8rem;border-radius:12px;background:var(--band-fg);color:var(--band-bg);font:700 .9375rem/1.25 var(--f-body);max-width:14rem;transform-origin:0 70%}
.say::before{content:"";position:absolute;left:-.45rem;bottom:.7rem;border:.45rem solid transparent;border-left:0;border-right-color:var(--band-fg)}
.play .bike{animation:ride 3.2s cubic-bezier(.15,.65,.3,1) both}
.play .wheel{animation:spin 3.2s cubic-bezier(.15,.65,.3,1) both}
.play .say{animation:pop .45s cubic-bezier(.3,1.4,.5,1) 2.9s both}
@keyframes ride{from{transform:translateX(-110vw)}to{transform:none}}
@keyframes spin{to{transform:rotate(1800deg)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.play .bike,.play .wheel,.play .say,.play .ferret,.tail{animation:none}}
.ticks{height:14px;background:
  repeating-linear-gradient(90deg,var(--band-line) 0 1px,transparent 1px 10px) left bottom/100% 6px no-repeat,
  repeating-linear-gradient(90deg,var(--band-line) 0 1px,transparent 1px 50px) left bottom/100% 14px no-repeat}
.panel{display:grid;gap:.75rem;padding-block:1.5rem 3rem}
.label{margin:.5rem 0 0;font:600 .8125rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.chips .chip{padding:.65rem .55rem}
.chips .chip b{font-size:.9375rem;letter-spacing:.01em}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;min-width:0;padding:.65rem .75rem;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;text-align:left}
.chip b{font:600 1.0625rem/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere}
.chip small{font:400 .75rem/1.2 var(--f-mono);color:var(--ink-soft)}
.seg .chip{min-height:3.25rem;justify-content:center}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.hint{margin:0;color:var(--ink-soft);font-size:.9375rem;max-width:60ch}
.btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:3.25rem;padding:.6rem 1rem;border-radius:6px;border:1.5px solid transparent;font:700 1.1875rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.btn.primary{background:var(--brass-fill);color:var(--on-brass)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:var(--ink-soft);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{font:500 .8125rem/1 var(--f-mono);background:var(--bad-bg);color:var(--bad);padding:.25rem .5rem;border-radius:99px;letter-spacing:0}
.prog{display:grid;gap:.5rem;margin-top:1rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.bar{height:.5rem;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.prog-row{display:flex;justify-content:space-between;gap:1rem;font-size:.9375rem;color:var(--ink-soft)}
.prog-row b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin-top:.5rem}
.stat{padding:.6rem .75rem;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stat b{display:block;font:500 1.375rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font:600 .75rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.link{justify-self:start;background:none;border:0;padding:.5rem 0;color:var(--ink-soft);text-decoration:underline;font-size:.9375rem}
.link.arm{color:var(--bad)}

/* Quiz */
.quiz{display:grid;gap:1.1rem;padding-block:1.25rem 3rem}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.count{font:400 .9375rem/1 var(--f-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.count b{font-weight:500;color:var(--ink);font-size:1.25rem}
.tag{font:600 .8125rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.strip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;height:1rem}
.cell{display:block;height:.5rem;background:var(--line);border-radius:1px}
.cell.ans{background:var(--ink-soft)}
.cell.ok{background:var(--ok)}
.cell.bad{background:var(--bad)}
.cell.cur{height:1rem}
.cell.cur:not(.ok):not(.bad):not(.ans){background:var(--brass-fill)}
.q{margin:.25rem 0 0;font:700 1.375rem/1.3 var(--f-body);max-width:34rem;text-wrap:pretty}
.q:focus{outline:none}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.75rem;align-items:center;width:100%;min-height:3.5rem;padding:.7rem .8rem;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;font-size:1.0625rem;line-height:1.35}
.opt .key{display:grid;place-items:center;width:2rem;height:2rem;border:1px solid var(--line);border-radius:4px;background:var(--paper);font:500 .9375rem/1 var(--f-mono)}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.opt .mark{font:600 .8125rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.opt.sel{border-color:var(--brass)}
.opt.sel .key{background:var(--brass-fill);border-color:var(--brass-fill);color:var(--on-brass)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .key{background:var(--ok);border-color:var(--ok);color:var(--ok-bg)}
.opt.ok .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .key{background:var(--bad);border-color:var(--bad);color:var(--bad-bg)}
.opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.62}
.fb{display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:baseline;padding:.75rem .9rem;border-radius:6px;border-left:4px solid}
.fb strong{font:700 1.125rem/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.fb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb span{color:var(--ink)}
.actions{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem}
.actions .btn{width:auto;min-width:0}
.actions .btn:only-child{grid-column:1/-1}

/* Risultato */
.result{display:grid;gap:1.25rem;padding-block:1.5rem 3rem}
.score{display:grid;gap:.25rem}
.big{margin:0;font:700 clamp(4.5rem,24vw,7rem)/.9 var(--f-display);font-variant-numeric:tabular-nums}
.big span{color:var(--ink-soft);font-size:.55em;margin-left:.1em}
.pct{margin:0;font:500 1rem/1.3 var(--f-mono);color:var(--ink-soft)}
.verdict{margin:.5rem 0 0;font-size:1.125rem;font-weight:700;max-width:30rem}
.result .btn{margin:0}
.rev-h{margin:.5rem 0 0;font:700 1.5rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.revs{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.rev{padding:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:grid;gap:.5rem}
.rev p{margin:0}
.rev-q{font-weight:700}
.rev-a{display:grid;gap:.1rem;padding:.5rem .65rem;border-radius:4px;border-left:4px solid;overflow-wrap:anywhere}
.rev-a span{font:600 .75rem/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.rev-a.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.rev-a.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.rev-a b{color:var(--ink);font-weight:400}
.rev-n{font:400 .75rem/1.2 var(--f-mono);color:var(--ink-soft)}
.clean{padding:1rem;background:var(--ok-bg);color:var(--ok);border-radius:6px;font-weight:700}
.btns{display:grid;gap:.6rem}
@media (prefers-reduced-motion:no-preference){
  .opt,.chip,.btn,.cell{transition:background-color .12s,border-color .12s}
}
</style>

</head>

<script>
(function(){
'use strict';

/* n = numero della domanda nel PDF, lv = livello (1 Normale, 2 Intermedio, 3 Pro) */
const RAW = [

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

const defP = () => ({seen:[], wrong:[], hist:[], levels:[1,2,3]});
function cleanP(o){
  o = o || {};
  const lv = arr(o.levels).filter(x => x === 1 || x === 2 || x === 3);
  return {seen:arr(o.seen), wrong:arr(o.wrong), hist:arr(o.hist).slice(-200), levels:lv.length ? lv : [1,2,3]};
}
function cleanCfg(c){
  c = c || {};
  const n = parseInt(c.size, 10);
  return {size:(n >= 0 && n <= 500) ? n : 20, from:(c.from === 'new' || c.from === 'wrong') ? c.from : 'all', both:c.both === true};
}
function load(){
  const root = {subj:'marina', instant:true, cfg:cleanCfg(), s:{marina:defP(), soc:defP()}};

      const o = JSON.parse(r) || {};
      if (SUBJ[o.subj]) root.subj = o.subj;
      root.instant = o.instant !== false;
      root.cfg = cleanCfg(o.cfg);
      root.s.marina = cleanP(o.s && o.s.marina);
      root.s.soc = cleanP(o.s && o.s.soc);
      return root;
    }
    const old = localStorage.getItem(OLD_KEY);
    if (old){ const o = JSON.parse(old) || {}; root.s.marina = cleanP(o); root.instant = o.instant !== false; }
  }catch(e){}
  return root;
}

function makeItems(qs){
  return qs.map(q => {
    const right = q.a[Math.floor(Math.random() * q.a.length)];
    const wrong = shuffle(q.w.filter(t => q.a.indexOf(t) < 0)).slice(0, 3);
    return {q:q, right:right, pick:null, opts:shuffle([{t:right, ok:true}].concat(wrong.map(t => ({t:t, ok:false}))))};
  });
}
const isSeen = q => ROOT.s[q.subj].seen.includes(q.n);
const isWrong = q => ROOT.s[q.subj].wrong.includes(q.n);
function cfgSubjects(){ return ROOT.cfg.both ? SUBJECTS : [SUBJ[ROOT.subj]]; }
function cfgPool(from){
  let pool = [];
  cfgSubjects().forEach(x => { pool = pool.concat(x.bank); });
  return from === 'new' ? pool.filter(q => !isSeen(q)) : from === 'wrong' ? pool.filter(isWrong) : pool;
}
function effFrom(){ const f = ROOT.cfg.from; return (f !== 'all' && !cfgPool(f).length) ? 'all' : f; }
function cfgSize(pool){ return ROOT.cfg.size > 0 ? Math.min(ROOT.cfg.size, pool.length) : pool.length; }
function pickBlock(pool, size){
  const fresh = shuffle(pool.filter(q => !isSeen(q)));
  const old = shuffle(pool.filter(isSeen));
  return fresh.concat(old).slice(0, size);
}
function startBlock(qs, kind){
  const mixed = new Set(qs.map(q => q.subj)).size > 1;
  Z = {items:makeItems(shuffle(qs)), i:0, instant:ROOT.instant, kind:kind, mixed:mixed, exitArm:false};
  view = 'quiz';
  render('q', true);
}
function startFromCfg(){
  const from = effFrom(), pool = cfgPool(from);
  if (pool.length) startBlock(pickBlock(pool, cfgSize(pool)), from === 'wrong' ? 'errors' : 'normal');
}

    '<div class="bar" role="img" aria-label="' + seenN + ' domande viste su ' + BANK.length + '"><i style="width:' + Math.round(100 * seenN / BANK.length) + '%"></i></div>' +
    '<p class="hint">Ogni nuovo blocco pesca prima le domande che non hai ancora incontrato.</p>' + wrongListHTML() + stats +
    (anyProgress ? '<button class="link' + (resetArm ? ' arm' : '') + '" data-act="reset">' + (resetArm ? 'Tocca ancora per azzerare questa materia' : 'Azzera progressi di questa materia') + '</button>' : '') +
    '</section><p class="legal">Materiale di studio non ufficiale: può contenere errori. I progressi restano solo su questo dispositivo e non vengono inviati né raccolti.</p></main>';
}

function stripHTML(items, cur, showAll){
  return '<div class="strip" style="--n:' + items.length + '" aria-hidden="true">' + items.map((x, j) => {
    let c = 'cell';
    if (cur && j === Z.i) c += ' cur';
    if (x.pick !== null){
      if (showAll || Z.instant) c += x.opts[x.pick].ok ? ' ok' : ' bad';
      else c += ' ans';
    }
    return '<i class="' + c + '"></i>';
  }).join('') + '</div>';
}

function quizHTML(){
  const n = Z.items.length, it = Z.items[Z.i];
  const answered = it.pick !== null;
  const reveal = Z.instant && answered;
  const opts = it.opts.map((o, k) => {
    if (it.hide && it.hide.indexOf(k) >= 0) return '';
    let c = 'opt', mark = '';
    if (reveal){
      if (o.ok){ c += ' ok'; mark = 'Giusta'; }
      else if (k === it.pick){ c += ' bad'; mark = 'La tua'; }
      else c += ' dim';
    } else if (it.pick === k) c += ' sel';
    return '<button class="' + c + '" data-act="pick" data-k="' + k + '"' + (reveal ? ' aria-disabled="true"' : '') + ' aria-pressed="' + (it.pick === k) + '">' +
      '<span class="key">' + 'ABCD'.charAt(k) + '</span><span class="txt">' + esc(o.t) + '</span><span class="mark">' + mark + '</span></button>';
  }).join('');
  let fb = '';
  if (reveal){
    const ok = it.opts[it.pick].ok;
    fb = '<div class="fb ' + (ok ? 'ok' : 'bad') + '" role="status"><strong>' + (ok ? 'Corretto' : 'Sbagliato') + '</strong>' +
      (ok ? '' : '<span>Risposta giusta: ' + esc(it.right) + '</span>') + (it.q.note ? '<span class="fb-note">' + esc(it.q.note) + '</span>' : '') + '</div>';
  }
  const last = Z.i === n - 1;
  const prev = (!Z.instant && Z.i > 0) ? '<button class="btn ghost" data-act="prev">Indietro</button>' : '';
  return '<main class="wrap quiz"><div class="qmeta"><span class="count">Domanda <b>' + (Z.i + 1) + '</b>/' + n + '</span><span class="tag">' + (Z.kind === 'errors' ? 'Ripasso errori · ' : '') + tagOf(it.q) + '</span></div>' +
    stripHTML(Z.items, true, false) +
    '<h2 class="q" id="qh" tabindex="-1">' + esc(it.q.q) + '</h2>' +
    '<div class="opts">' + opts + '</div>' + fb +
    '<div class="actions">' + prev + '<button class="btn primary" data-act="next"' + (answered ? '' : ' disabled') + '>' + (last ? 'Concludi blocco' : 'Avanti') + '</button></div>' +
    '<button class="btn ghost half" data-act="half"' + (it.half || answered ? ' disabled' : '') + '>50:50' + (it.half ? ' <small>usato</small>' : '') + '</button></main>';
}

function resultHTML(){
  const items = Z.items, n = items.length;
  const score = items.filter(x => x.opts[x.pick].ok).length;
  const pct = Math.round(100 * score / n);
  const verdict = pct >= 90 ? 'Preparazione solida su questo blocco.' : pct >= 70 ? 'Buon livello. Ripassa gli errori qui sotto.' : pct >= 50 ? 'Serve ancora ripasso. Rifai gli errori e poi un nuovo blocco.' : 'Da rivedere. Parti dagli errori di questo blocco.';
  const wrong = items.filter(x => !x.opts[x.pick].ok);
  const revs = wrong.map(x => {
    const chosen = x.opts[x.pick].t;
    const meta = (Z.mixed ? tagOf(x.q) : '') + (Z.mixed && x.q.note ? ' · ' : '') + (x.q.note || '');
    return '<li class="rev"><p class="rev-q">' + esc(x.q.q) + '</p>' +
      '<p class="rev-a bad"><span>La tua risposta</span><b>' + esc(chosen) + '</b></p>' +
      '<p class="rev-a ok"><span>Risposta giusta</span><b>' + esc(x.right) + '</b></p>' +
      (meta ? '<p class="rev-n">' + esc(meta) + '</p>' : '') + '</li>';
  }).join('');
  return '<main class="wrap result"><section class="score"><p class="eyebrow" style="color:var(--brass)">' + (Z.kind === 'errors' ? 'Ripasso concluso' : 'Blocco concluso') + '</p>' +
    '<p class="big">' + score + '<span>/' + n + '</span></p><p class="pct">' + pct + '% di risposte corrette</p><p class="verdict">' + verdict + '</p></section>' +
    stripHTML(items, false, true) +
    '<div class="btns"><button class="btn primary" data-act="again">Nuovo blocco</button>' +
    (wrong.length ? '<button class="btn ghost" data-act="retry">Rifai i ' + wrong.length + ' errori</button>' : '') + '</div>' +
    (wrong.length ? '<h2 class="rev-h">Da ripassare</h2><ol class="revs">' + revs + '</ol>' : '<p class="clean">Nessun errore in questo blocco.</p>') +
    '</main>';
}

function render(focus, top){
  const app = document.getElementById('app');
  let html;
  if (view === 'home') html = band('<span class="band-tag">99 domande</span>'.replace('99', BANK.length)) + homeHTML();
  else if (view === 'quiz') html = band('<button class="band-btn' + (Z.exitArm ? ' arm' : '') + '" data-act="exit">' + (Z.exitArm ? 'Conferma uscita' : 'Esci') + '</button>') + quizHTML();
  else html = band('<button class="band-btn" data-act="home">Home</button>') + resultHTML();
  app.innerHTML = html;
  if (view === 'home') intro = false;
  if (top) window.scrollTo(0, 0);
  if (focus){
    const el = focus === 'q' ? app.querySelector('#qh') : focus === 'next' ? app.querySelector('[data-act="next"]') : app.querySelector('.opt.sel');
    if (el) el.focus({preventScroll: focus === 'q'});
  }
}

function pick(k){
  const it = Z.items[Z.i];
  if (!it || (Z.instant && it.pick !== null) || k < 0 || k >= it.opts.length || (it.hide && it.hide.indexOf(k) >= 0)) return;
  it.pick = k;
  Z.exitArm = false;
  render(Z.instant ? 'next' : 'sel');
}
function finish(){
  const items = Z.items, by = {};
  items.forEach(x => {
    const st = ROOT.s[x.q.subj], id = x.q.n, ok = x.opts[x.pick].ok;
    if (!st.seen.includes(id)) st.seen.push(id);
    st.wrong = st.wrong.filter(w => w !== id);
    if (!ok) st.wrong.push(id);
    const b = by[x.q.subj] || (by[x.q.subj] = {s:0, t:0});
    b.t++;
    if (ok) b.s++;
  });
  Object.keys(by).forEach(k => {
    const st = ROOT.s[k];
    st.hist.push({d:Date.now(), s:by[k].s, t:by[k].t});
    st.hist = st.hist.slice(-200);
  });
  save();
  view = 'result';
  render(null, true);
}
function next(){
  const it = Z && Z.items[Z.i];
  if (!it || it.pick === null) return;
  if (Z.i === Z.items.length - 1) finish();
  else { Z.i++; render('q', true); }
}

function act(a, d){
  switch (a){
    case 'subj':
      if (SUBJ[d.v] && d.v !== ROOT.subj){ ROOT.subj = d.v; P = ROOT.s[d.v]; BANK = SUBJ[d.v].bank; resetArm = false; save(); render(); }
      break;
    case 'half': {
      const it = Z && Z.items[Z.i];
      if (!it || it.half || it.pick !== null) break;
      const wr = [];
      it.opts.forEach((o, k) => { if (!o.ok) wr.push(k); });
      it.hide = shuffle(wr).slice(0, 2);
      it.half = true;
      render();
      break;
    }
    case 'ctoggle': cOpen = !cOpen; render(); break;
    case 'size': ROOT.cfg.size = +d.v; save(); render(); break;
    case 'from': if (['all','new','wrong'].indexOf(d.v) >= 0){ ROOT.cfg.from = d.v; save(); render(); } break;
    case 'both': ROOT.cfg.both = !ROOT.cfg.both; save(); render(); break;
    case 'wtoggle': {
      const cur = wOpen[d.s] !== undefined ? wOpen[d.s] : d.s === ROOT.subj;
      wOpen[d.s] = !cur; render(); break;
    }
    case 'wall': wAll[d.s] = !wAll[d.s]; render(); break;
    case 'unwrong':
      if (ROOT.s[d.s]){ ROOT.s[d.s].wrong = ROOT.s[d.s].wrong.filter(n => n !== +d.v); save(); render(); }
      break;
    case 'mode': ROOT.instant = d.v === '1'; save(); render(); break;
    case 'start': startFromCfg(); break;
    case 'errors': {
      const pool = BANK.filter(q => P.wrong.includes(q.n));
      if (pool.length) startBlock(pickBlock(pool, cfgSize(pool)), 'errors');
      break;
    }
    case 'pick': pick(+d.k); break;
    case 'next': next(); break;
    case 'prev': if (Z && Z.i > 0){ Z.i--; render('q', true); } break;
    case 'exit':
      if (Z.exitArm){ view = 'home'; Z = null; render(null, true); }
      else { Z.exitArm = true; render(); }
      break;
    case 'home': view = 'home'; Z = null; render(null, true); break;
    case 'again': startFromCfg(); break;
    case 'retry': {
      const qs = Z.items.filter(x => !x.opts[x.pick].ok).map(x => x.q);
      if (qs.length) startBlock(qs, 'errors');
      break;
    }
    case 'reset':
      if (resetArm){ const lv = P.levels; P = ROOT.s[ROOT.subj] = defP(); P.levels = lv; save(); resetArm = false; }
      else { resetArm = true; setTimeout(() => { if (resetArm){ resetArm = false; if (view === 'home') render(); } }, 4000); }
      render();
      break;
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.hasAttribute('disabled')) return;
  act(b.getAttribute('data-act'), {v:b.getAttribute('data-v'), k:b.getAttribute('data-k'), s:b.getAttribute('data-s')});
});
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'cfgSize') return;
  const n = parseInt(e.target.value, 10);
  if (n >= 1) ROOT.cfg.size = Math.min(n, 500);
  save();
  render();
});
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  let i = 'abcd'.indexOf(k);
  if (k.length !== 1) i = -1;
  if (i < 0) i = '1234'.indexOf(k);
  if (k.length === 1 && i >= 0){ e.preventDefault(); pick(i); return; }
  if ((k === 'enter' || k === 'arrowright') && !(e.target.closest && e.target.closest('button'))){ e.preventDefault(); next(); }
});

render();
})();
</script>

</body>
</html>
